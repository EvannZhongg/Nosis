[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosis-agent"
version = "0.1.0"
description = "An open-source, lightweight personal agent runtime with a complete toolset and plugin system, shared by its GUI and TUI."
requires-python = ">=3.11"
dependencies = [
    "exa-py>=2.0",
    "httpx>=0.27",
    # The MCP streamable HTTP transport configures its headers through an
    # httpx2 client, so both HTTP clients are direct requirements.
    "httpx2>=2.5",
    "litellm>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "tzdata>=2022.1",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
gui = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13", "python-multipart>=0.0.9"]

[project.scripts]
nosis = "interfaces.launch:main"
nosis-gui = "interfaces.gui.server:main"

[tool.setuptools.packages.find]
include = ["agent_core*", "agent_runtime*", "interfaces*"]
# Without this, discovery walks every directory in the tree, so the
# TypeScript sources and node_modules under interfaces/ become packages.
namespaces = false

[tool.setuptools.package-data]
"interfaces" = ["tui/dist/app.js"]
"agent_runtime" = [
    "defaults/*.json",
    "defaults/prompts_template/*.md",
    "defaults/skills/**/*",
    "defaults/plugins/**/*",
    # The glob above skips dotfiles, so a plugin's MCP declaration needs its
    # own pattern to reach the wheel.
    "defaults/plugins/*/.mcp.json",
]
"interfaces.gui" = ["static/*", "static/assets/*"]

# The recursive skill pattern above would otherwise carry whatever sits in the
# working tree, so byte-code caches and Finder metadata reach the wheel when a
# skill's own scripts have been run in place.
[tool.setuptools.exclude-package-data]
"agent_runtime" = [
    "defaults/skills/**/__pycache__/*",
    "defaults/skills/**/*.pyc",
    "defaults/skills/**/.DS_Store",
    "defaults/plugins/**/__pycache__/*",
    "defaults/plugins/**/*.pyc",
    "defaults/plugins/**/.DS_Store",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nosis-agent"
version = "0.1.0"
description = "A minimal multi-turn AI agent."
requires-python = ">=3.11"
dependencies = [
    "exa-py>=2.0",
    "litellm>=1.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "mcp>=2.0,<3",
]

[project.optional-dependencies]
gui = ["fastapi>=0.115", "uvicorn>=0.30", "websockets>=13", "python-multipart>=0.0.9"]

[project.scripts]
nosis = "interfaces.launch:main"
nosis-gui = "interfaces.gui.server:main"

[tool.setuptools.packages.find]
include = ["agent_core*", "interfaces*"]
# Without this, discovery walks every directory in the tree, so the
# TypeScript sources and node_modules under interfaces/ become packages.
namespaces = false

[tool.setuptools.package-data]
agent_core = ["prompts/*.md"]
"interfaces" = ["tui/dist/app.js"]
"interfaces.bridge" = [
    "defaults/*.json",
    "defaults/skills/*/SKILL.md",
    "defaults/skills/*/license.txt",
    "defaults/skills/*/scripts/*.py",
]
"interfaces.gui" = ["static/*", "static/assets/*"]

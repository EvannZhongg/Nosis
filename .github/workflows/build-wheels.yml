name: build-platform-wheels

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: |
            interfaces/tui/dist/app.js
            interfaces/gui/static/
            interfaces/mobile/dist/*.cjs
          if-no-files-found: error

  windows-macos:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
            platform: win_amd64
          - os: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            platform: win_arm64
          - os: macos-15-intel
            arch: x64
            target: x86_64-apple-darwin
            platform: macosx_11_0_x86_64
          - os: macos-15
            arch: arm64
            target: aarch64-apple-darwin
            platform: macosx_11_0_arm64
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: interfaces
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: ${{ matrix.arch }}
      - run: cargo test --locked --manifest-path nosis-sandbox/Cargo.toml
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: python tests/smoke_wheel.py dist ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: nosis-agent-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  linux:
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend
          path: interfaces
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable and probe bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-user --unshare-pid --unshare-net --unshare-ipc --unshare-uts --ro-bind / / /bin/true
      - run: cargo test --locked --manifest-path nosis-sandbox/Cargo.toml
      - name: Build and test manylinux wheel
        run: |
          docker run --rm \
            -v "$PWD:/io" -w /io \
            -e CARGO_TARGET_DIR=/tmp/nosis-sandbox-target \
            quay.io/pypa/manylinux_2_28_${{ matrix.arch }} \
            bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
              export PATH="$HOME/.cargo/bin:$PATH"
              /opt/python/cp311-cp311/bin/python -m pip install build wheel
              /opt/python/cp311-cp311/bin/python -m build --wheel
              /opt/python/cp311-cp311/bin/python -m wheel tags --platform-tag manylinux_2_28_${{ matrix.arch }} --remove dist/*.whl
              /opt/python/cp311-cp311/bin/python tests/smoke_wheel.py dist manylinux_2_28_${{ matrix.arch }}
            '
      - uses: actions/upload-artifact@v4
        with:
          name: nosis-agent-manylinux_2_28_${{ matrix.arch }}
          path: dist/*.whl
          if-no-files-found: error
